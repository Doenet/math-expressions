[workspace]
members = [
    "packages/math-expressions-rs",
    "packages/math-expressions-rs-wasm",
]
# The wasm-binding crate is a member (shared lockfile + release profile) but not
# a default member, so `cargo build` / `cargo test` (host) skip it. It is built
# explicitly for wasm32 by packages/math-expressions-rs-wasm/build-wasm.sh.
# It does carry host-runnable unit tests, so CI runs `cargo test --workspace`
# (see .github/workflows/ci.yml) rather than the bare `cargo test`.
default-members = ["packages/math-expressions-rs"]
resolver = "2"

# Size-oriented release profile (tmp/IMPROVEMENT_PLAN.md Phase 0); profiles
# must live in the workspace root or cargo ignores them. Measured 1.70 MB ->
# 1.10 MB wasm (-35%). `panic = "abort"` also matches a standing assumption
# at the JS boundary (expr/serde.rs relies on aborting panics).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Note on `panic = "abort"` and diagnosability (DOENET_INTEGRATION item 2): it
# was long assumed that this line is why a wasm panic reaches the browser as a
# bare `RuntimeError: unreachable`. It is not. std runs the panic hook *before*
# aborting, so the message survives this profile intact — what was missing was
# a hook, since the default one writes to a stderr that goes nowhere on
# wasm32-unknown-unknown. One is now installed unconditionally in the wasm
# crate; measured cost 1,958 bytes. There is no separate diagnostic profile
# because a separate profile turned out to buy nothing.
